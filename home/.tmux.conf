# General behavior
# Explicit, not left to $SHELL: the tmux server inherits $SHELL from whatever
# process first starts it, so panes silently end up on zsh instead of fish if
# the server happens to get spawned from a zsh context.
set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,tmux-256color:RGB,ghostty:RGB"
set -g escape-time 10
set -g focus-events on
# Off by default in tmux, which silently reports Shift+Enter (and other
# modified keys) identically to plain Enter to whatever's running inside --
# needed for apps like codex/claude that treat Shift+Enter as "newline".
# -s (server-scope, not -g) and csi-u format specifically, since the default
# format (xterm modifyOtherKeys, "CSI 27;mod;code~") apparently isn't
# recognized by codex even though the modifier info does get through.
set -s extended-keys on
set -s extended-keys-format csi-u
set -g history-limit 50000
set -g renumber-windows on
set -g set-clipboard on

# Indexes
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# Keys
setw -g mode-keys vi
set -g status-keys vi

# Leader key: C-b -> C-a. Single modifier (not a multi-modifier chord like
# C-M-a), so encoding is a plain control byte with no ESC-prefix ambiguity.
# Things3's quick-entry used to own Ctrl-a globally; moved to Cmd-Shift-A so
# tmux can have it. Double-tap (C-a C-a) sends a literal C-a through to
# readline/vim for "move to start of line" when actually needed.
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Splits open in the current pane's directory. | and - are the common
# community remap (mnemonic: the character looks like the resulting divider);
# kept tmux's own %/" bindings too since they're harmless.
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '|' split-window -h -c "#{pane_current_path}"
bind-key '-' split-window -v -c "#{pane_current_path}"

# Navigation: prefix once, then keep tapping hjkl to hop panes while the
# repeat window is open (no need to re-invoke the prefix each time).
bind-key -r h select-pane -L
bind-key -r j select-pane -D
bind-key -r k select-pane -U
bind-key -r l select-pane -R
bind-key -r ㅗ select-pane -L
bind-key -r ㅓ select-pane -D
bind-key -r ㅏ select-pane -U
bind-key -r ㅣ select-pane -R
bind-key ㅋ resize-pane -Z
# Ghostty maps Korean input variants to Meta Latin sequences now owned by Tilish.
# Prefix Korean bindings remain native.
bind-key -n M-[ previous-window
bind-key -n M-] next-window

# Window switching by number, same repeat behavior: prefix once, then keep
# tapping bare number keys (no Ctrl held) within the repeat window.
bind-key -r 0 select-window -t :0
bind-key -r 1 select-window -t :1
bind-key -r 2 select-window -t :2
bind-key -r 3 select-window -t :3
bind-key -r 4 select-window -t :4
bind-key -r 5 select-window -t :5
bind-key -r 6 select-window -t :6
bind-key -r 7 select-window -t :7
bind-key -r 8 select-window -t :8
bind-key -r 9 select-window -t :9
set -g repeat-time 800

# new-window (c), kill-pane (x), next/prev-window (n/p), detach (d) are
# tmux's own prefix-table defaults -- they just work once prefix is C-a.

# Reload
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"

# ---- simhae (pelagic) theme ----
# Hex values mirror .config/ghostty/themes/simhae-pelagic.ghostty AND
# sketchybar's base00-17 palette (helpers/colors.lua), so tmux chrome matches
# both exactly (requires the RGB overrides above; no plugin/TPM needed).
#   bg=#0A1F2E (base00)  surface=#142C3E (base01)  sel-bg=#1C3A50 (base02)
#   border=#24425C (base03)  border-accent=#4A6E86 (base04)  fg=#C6D8E4 (base05)
#   red=#C47A72  green=#68BE92  gold=#C8AE6A  blue=#7896CC  purple=#9A7EC8
#   teal=#50C4C0  sel-fg=#D6E2E8

# Status bg uses sel-bg (base02) so the three-line tmux bar stays separated
# from the pane background without introducing a new color.
set -g status-style "bg=#{?client_prefix,#0A1F2E,#{?#{||:#{==:#{@cw_context_prod},1},#{m/r:prod|dragon-kks|dragon-ssk|xpssk-02,#{@kube_context}|#{@aws_profile}}},#C47A72,#1C3A50}},fg=#{?client_prefix,#C6D8E4,#{?#{||:#{==:#{@cw_context_prod},1},#{m/r:prod|dragon-kks|dragon-ssk|xpssk-02,#{@kube_context}|#{@aws_profile}}},#0A1F2E,#C6D8E4}}"
set -g @status_box_variant '#{?client_prefix,prefix,#{?#{||:#{==:#{@cw_context_prod},1},#{m/r:prod|dragon-kks|dragon-ssk|xpssk-02,#{@kube_context}|#{@aws_profile}}},prod,normal}}'
set -g @status_box_bg '#{?client_prefix,#0A1F2E,#{?#{||:#{==:#{@cw_context_prod},1},#{m/r:prod|dragon-kks|dragon-ssk|xpssk-02,#{@kube_context}|#{@aws_profile}}},#C47A72,#1C3A50}}'
set -g @status_box_fg '#{?client_prefix,#C6D8E4,#{?#{||:#{==:#{@cw_context_prod},1},#{m/r:prod|dragon-kks|dragon-ssk|xpssk-02,#{@kube_context}|#{@aws_profile}}},#0A1F2E,#C6D8E4}}'
set -g @status_box_border '#{?client_prefix,#C6D8E4,#{?#{||:#{==:#{@cw_context_prod},1},#{m/r:prod|dragon-kks|dragon-ssk|xpssk-02,#{@kube_context}|#{@aws_profile}}},#0A1F2E,#4A6E86}}'
set -g @status_box_inactive '#{?client_prefix,#4A6E86,#{?#{||:#{==:#{@cw_context_prod},1},#{m/r:prod|dragon-kks|dragon-ssk|xpssk-02,#{@kube_context}|#{@aws_profile}}},#1C3A50,#4A6E86}}'

# Boxed status with one pane-bg spacer line above it. Keep it focused on tmux
# navigation for now:
# session name, current window, and window list.
set -g status 4

set -g status-format[0] '#[bg=#{E:@status_box_bg}]#{R: ,#{window_width}}'
set -g status-format[1] '#[fg=#{E:@status_box_border},bg=#{E:@status_box_bg}]╭─ #[fg=#{E:@status_box_fg},bg=#{E:@status_box_bg},bold]#S #[fg=#{E:@status_box_border},bg=#{E:@status_box_bg},nobold]#{R:─,#{e|-:#{window_width},#{e|+:#{n:session_name},5}}}╮'
set -g window-status-format '#{?#{==:#{@attention_window_state},waiting},#[fg=#0A1F2E#,bg=#C8AE6A#,bold],#{?#{==:#{@attention_window_state},done},#[fg=#0A1F2E#,bg=#9A7EC8#,bold],#[default]}}[#[underscore]#{window_index}#[nounderscore]·#{window_name}#{?#{==:#{@attention_window_state},waiting},?,#{?#{==:#{@attention_window_state},done},✓,}}]#[default]'
set -g window-status-current-format '#[fg=#0A1F2E,bg=#50C4C0,bold][#[underscore]#{window_index}#[nounderscore]·#{window_name}#{?window_zoomed_flag,#{?#{==:#{@attention_window_state},waiting},?,#{?#{==:#{@attention_window_state},done},✓,}},}]#[default]'
set -g status-format[2] "#[fg=#{E:@status_box_border},bg=#{E:@status_box_bg}]│ #[fg=#{E:@status_box_inactive},bg=#{E:@status_box_bg}]#[push-default]#{W:#{E:window-status-format},#{E:window-status-current-format}}#[align=right]#(~/.tmux/scripts/status-box.sh \"#{E:@status_box_variant}\" x#{q:@kube_context} x#{q:@aws_profile} x#{q:@cw_context})"
set -g status-format[3] '#[fg=#{E:@status_box_border},bg=#{E:@status_box_bg}]╰#{R:─,#{e|-:#{window_width},2}}╯'

set -g monitor-bell on

# Codex animates its spinner by changing pane_title several times per second.
# Reconcile only semantic transitions: entering working/waiting, returning to
# idle, or clearing stale waiting attention. E: expands the stored predicate in
# the hook pane's format context before checking the coalescing flag.
set -g @attention_title_transition '#{||:#{&&:#{m/r:^(⠋|⠙|⠹|⠸|⠼|⠴|⠦|⠧|⠇|⠏) ,#{pane_title}},#{||:#{!=:#{@attention_codex_state},working},#{==:#{@attention_state},waiting}}},#{||:#{&&:#{m/ri:action required [|] ,#{pane_title}},#{!=:#{@attention_codex_state},waiting}},#{&&:#{&&:#{==:#{m/r:^(⠋|⠙|⠹|⠸|⠼|⠴|⠦|⠧|⠇|⠏) ,#{pane_title}},0},#{==:#{m/ri:action required [|] ,#{pane_title}},0}},#{||:#{!=:#{@attention_codex_state},},#{==:#{@attention_state},waiting}}}}}'
set-hook -g pane-title-changed 'if-shell -F "#{&&:#{E:@attention_title_transition},#{!=:#{@attention_reconcile_pending},1}}" "set-option -p @attention_reconcile_pending 1 \; run-shell -b '\''~/.local/libexec/tmux-pane-attention reconcile-title #{hook_pane}'\''"'
# Visibility hooks always queue behind the controller lock. Pre-checking the
# aggregate here races with an in-flight reconcile that has not published it
# yet; the helper performs a cheap post-lock aggregate check instead.
set-hook -g client-focus-in     'run-shell -b "~/.local/libexec/tmux-pane-attention acknowledge-visible"'
set-hook -g after-select-window 'run-shell -b "~/.local/libexec/tmux-pane-attention acknowledge-visible"'
set-hook -g after-resize-pane   'run-shell -b "~/.local/libexec/tmux-pane-attention acknowledge-visible"'
set-hook -g pane-moved          'run-shell -b "~/.local/libexec/tmux-pane-attention reconcile-all"'
run-shell -b '~/.local/libexec/tmux-pane-attention reconcile-all'

set -g pane-border-style "fg=#C6D8E4,bg=#1C3A50"
set -g pane-active-border-style "fg=#071420,bg=#D4A870,bold"
# Space cells blend inactive borders into the terminal background while the
# active border remains visible through its contrasting background style.
set -g pane-border-lines spaces
set -g pane-border-indicators both

# Status line above each pane border: index + title. pane_title defaults to
# fish's cwd-based title (redundant with the directory already shown in the
# tmux status bar) unless a pane overrides `fish_title` locally -- session
# functions like rar-dev.fish do that for panes worth naming (e.g. "pulsar-dev"),
# so blank/cwd titles here just mean the pane hasn't opted in.
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_title} "

set -g message-style "bg=#C8AE6A,fg=#0A1F2E,bold"
set -g message-command-style "bg=#C8AE6A,fg=#0A1F2E,bold"

setw -g mode-style "bg=#50C4C0,fg=#0A1F2E"
setw -g clock-mode-colour "#50C4C0"

# ---- Plugins (TPM) ----
set -g @tilish-default 'tiled'
# Preserve the selected split geometry when panes are added or removed; only
# equalize sizes within that geometry.
set -g @tilish-enforce 'size'
set -g @tilish-createauto 'off'

# Keep every pane visible while giving the selected pane most of the available
# width and height. pane-focus owns after-select-pane[0]; the attention hook
# is registered after TPM initializes so both callbacks survive.
set -g @pane-focus-enabled on
set -g @pane-focus-size '80'
set -g @pane-focus-direction '+'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jabirali/tmux-tilish'
set -g @plugin 'graemedavidson/tmux-pane-focus#v0.5.0-alpha'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

# kube-tmux context display names: the mapping (company-internal context
# names) lives in ~/.tmux/config/kube-func.sh, which kube-tmux
# auto-sources if present at ~/.tmux/config/kube-func.sh. On machines without
# the work/ package stowed, this is a harmless no-op (function won't exist,
# kube-tmux falls back to the raw context name).
set-environment -g KUBE_TMUX_CONTEXT_FUNCTION kube_tmux_shorten_context

run '~/.tmux/plugins/tpm/tpm'

# pane-focus initializes its unindexed hook through TPM, clearing any existing
# after-select-pane hook array. Register attention afterward at an owned index.
set-hook -g after-select-pane[10] 'run-shell -b "~/.local/libexec/tmux-pane-attention acknowledge-visible"'

# Tilish's relative swap targets can resolve against the wrong client when a
# tmux server has clients on multiple monitors. Pass the invoking pane ID to a
# helper that resolves its neighbor explicitly. Ghostty's extended-key
# protocol reports Alt+Shift+hjkl as M-S-HJKL, so bind both spellings.
bind-key -n M-H run-shell '~/.local/libexec/tmux-move-pane left "#{pane_id}"'
bind-key -n M-J run-shell '~/.local/libexec/tmux-move-pane down "#{pane_id}"'
bind-key -n M-K run-shell '~/.local/libexec/tmux-move-pane up "#{pane_id}"'
bind-key -n M-L run-shell '~/.local/libexec/tmux-move-pane right "#{pane_id}"'
bind-key -n M-S-H run-shell '~/.local/libexec/tmux-move-pane left "#{pane_id}"'
bind-key -n M-S-J run-shell '~/.local/libexec/tmux-move-pane down "#{pane_id}"'
bind-key -n M-S-K run-shell '~/.local/libexec/tmux-move-pane up "#{pane_id}"'
bind-key -n M-S-L run-shell '~/.local/libexec/tmux-move-pane right "#{pane_id}"'

# Tilish's M-Q binding also reapplies the layout. Keep pane removal in one
# lifecycle path so each explicit kill only equalizes sizes once.
bind-key -n M-Q kill-pane

# Replace only Tilish's pane-exited[0] callback so natural exits target the
# window that actually changed. run-shell expands hook_window before invoking
# target-aware tmux commands.
set-hook -g pane-exited[0] 'run-shell -b '\''tmux select-layout -E -t "#{hook_window}"; ~/.local/libexec/tmux-pane-attention reconcile-window "#{hook_window}"'\'''

# kill-pane does not expose its original target to command hooks. Interactive
# bindings kill the current pane, so an owned high index safely handles that
# path without clearing callbacks installed by other plugins.
set-hook -g after-kill-pane[90] 'select-layout -E ; run-shell -b "~/.local/libexec/tmux-pane-attention reconcile-window #{window_id}"'
