<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SketchyBar · Compact popups</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "SF Pro", -apple-system, BlinkMacSystemFont, sans-serif;
      background: #071420;
      color: #c6d8e4;
      --bar: #0a1f2e;
      --panel: #142c3e;
      --border: #24425c;
      --muted: #8ba7bb;
      --green: #68be92;
      --yellow: #c8ae6a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 68px 24px 32px; }
    main { max-width: 1040px; margin: auto; }
    .eyebrow { margin: 0 0 14px; color: var(--muted); font-size: 11px; letter-spacing: .16em; }
    h1 { margin: 0; color: #ecf0f4; font-size: clamp(25px, 4vw, 36px); letter-spacing: -.045em; font-weight: 600; }
    .intro { margin: 12px 0 30px; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .switcher { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--border); border-radius: 9px; }
    .switcher button { border: 0; border-radius: 5px; padding: 7px 12px; background: transparent; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; }
    .switcher button[aria-pressed="true"] { background: #1c3a50; color: #ecf0f4; }
    button:focus-visible { outline: 2px solid #50c4c0; outline-offset: 3px; }
    .scale { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; cursor: pointer; }
    input { accent-color: #50c4c0; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { overflow: hidden; border: 1px solid #1c3a50; border-radius: 12px; background: #091a28; }
    .card header { display: flex; align-items: center; justify-content: space-between; padding: 17px 19px; border-bottom: 1px solid #142c3e; }
    h2 { margin: 0; font-size: 13px; font-weight: 500; }
    .index { color: #4a6e86; font-size: 11px; font-variant-numeric: tabular-nums; }
    .stage { position: relative; min-height: 234px; padding-top: 31px; }
    .mockbar { height: 40px; margin: 0 18px; display: flex; justify-content: center; align-items: center; background: var(--bar); border-radius: 8px; }
    .anchor { position: relative; width: 26px; height: 40px; display: flex; align-items: center; justify-content: center; }
    .bar-icon { width: 20px; height: 20px; }
    .bar-battery { width: 22px; height: 22px; }
    .popup { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: 196px; padding: 9px 11px; border: 2px solid var(--border); border-radius: 4px; background: var(--panel); font-size: 12px; line-height: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .stage:hover .popup { border-color: #365a73; }
    .row { display: flex; align-items: center; gap: 7px; min-height: 20px; }
    .row + .row { margin-top: 4px; }
    .row > .icon { flex: 0 0 15px; }
    .icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .bar-icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .split { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px; }
    .metric { display: inline-flex; align-items: center; gap: 2px; }
    .metric .icon { width: 14px; height: 14px; }
    .ssid { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .muted { color: var(--muted); }
    .green { color: var(--green); }
    .yellow { color: var(--yellow); }
    .blue { color: #7896cc; }
    .warm { color: #c8945a; }
    .dot { color: #4a6e86; padding: 0 2px; }
    .large .mockbar { margin-left: 10px; margin-right: 10px; }
    .large .anchor { transform: scale(1.35); transform-origin: center top; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 22px; color: #718da3; font-size: 11px; line-height: 1.7; }
    footer a { color: inherit; text-underline-offset: 3px; }
    #icon-library { position: absolute; width: 0; height: 0; overflow: hidden; }
    @media (max-width: 780px) { .cards { grid-template-columns: 1fr; max-width: 420px; margin: auto; } body { padding-top: 36px; } .stage { min-height: 215px; } }
    @media (prefers-reduced-motion: no-preference) { .popup { transition: border-color .15s; } }
  </style>
</head>

  <main>
    <p class="eyebrow">SKETCHYBAR / POPUP STUDY</p>
    <h1>정보만, 간결하게.</h1>
    <p class="intro">설명은 덜고, 아이콘과 값만. 세 팝업을 펼쳐 놓은 미리보기.</p>
    <div class="toolbar">
      <div class="switcher" role="group" aria-label="샘플 상태">
        <button type="button" data-state="normal" aria-pressed="true">일반</button>
        <button type="button" data-state="charging" aria-pressed="false">충전 중</button>
        <button type="button" data-state="snow" aria-pressed="false">눈 예보</button>
        <button type="button" data-state="unavailable" aria-pressed="false">정보 없음</button>
      </div>
      <label class="scale"><input id="enlarge" type="checkbox">크게 보기</label>
    </div>
    <div class="cards" id="cards">
      <section class="card" aria-labelledby="battery-title">
        <header><h2 id="battery-title">배터리</h2><span class="index">01</span></header>
        <div class="stage"><div class="mockbar"><div class="anchor">
          <svg class="bar-icon bar-battery green" id="battery-bar" aria-hidden="true"><use href="#battery-vertical-4"/></svg>
          <div class="popup" role="group" aria-label="배터리 상세">
            <div class="row"><svg class="icon green" id="battery-status" aria-hidden="true"><use href="#battery-vertical-4"/></svg><span id="battery-percent">82%</span></div>
            <div class="row" id="battery-time-row" aria-label="예상 사용 가능 시간"><svg class="icon muted" aria-hidden="true"><use href="#clock"/></svg><span id="battery-time">3h 20m</span></div>
          </div>
        </div></div></div>
      </section>
      <section class="card" aria-labelledby="weather-title">
        <header><h2 id="weather-title">날씨</h2><span class="index">02</span></header>
        <div class="stage"><div class="mockbar"><div class="anchor">
          <svg class="bar-icon yellow" id="weather-bar" aria-hidden="true"><use href="#cloud"/></svg>
          <div class="popup" role="group" aria-label="날씨 상세">
            <div class="row"><svg class="icon yellow" id="weather-status" aria-hidden="true"><use href="#cloud"/></svg><span class="metric"><span id="weather-temp">18°</span> <span class="muted" id="weather-feels" title="체감온도">(17°)</span></span></div>
            <div class="row"><div class="split">
              <span class="metric" aria-label="최저기온"><svg class="icon blue" aria-hidden="true"><use href="#temperature-minus"/></svg><span id="weather-low">12°</span></span>
              <span class="metric" aria-label="최고기온"><svg class="icon warm" aria-hidden="true"><use href="#temperature-plus"/></svg><span id="weather-high">21°</span></span>
            </div></div>
            <div class="row"><div class="split">
              <span class="metric" title="오늘 최대 강수확률 · 비와 눈 포함"><svg class="icon blue" id="weather-precip-icon" aria-hidden="true"><use href="#cloud-rain"/></svg><span id="weather-probability">30%</span></span>
              <span class="metric" title="현재 풍속 · 지상 10m 기준"><svg class="icon muted" aria-hidden="true"><use href="#wind"/></svg><span id="weather-wind">3.2m/s</span></span>
            </div></div>
          </div>
        </div></div></div>
      </section>
      <section class="card" aria-labelledby="wifi-title">
        <header><h2 id="wifi-title">Wi-Fi</h2><span class="index">03</span></header>
        <div class="stage"><div class="mockbar"><div class="anchor">
          <svg class="bar-icon green" id="wifi-bar" aria-hidden="true"><use href="#wifi"/></svg>
          <div class="popup" role="group" aria-label="Wi-Fi 상세">
            <div class="row"><svg class="icon green" id="wifi-status" aria-hidden="true"><use href="#wifi"/></svg><span class="ssid" id="wifi-state" title="Home Wi-Fi">Home Wi-Fi</span></div>
            <div class="row" aria-label="로컬 IP 주소"><svg class="icon muted" aria-hidden="true"><use href="#network"/></svg><span id="wifi-ip">192.168.0.24</span></div>
          </div>
        </div></div></div>
      </section>
    </div>
    <footer><span>샘플 데이터 · 실제 설정 변경 없음 · 아이콘 1.5px / 팝업 텍스트 12px</span><a href="https://github.com/tabler/tabler-icons">Tabler Icons · MIT</a></footer>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const setText = (id, value) => { $(id).textContent = value; };
    function setIcon(id, name, active, color = 'green') {
      const element = $(id);
      element.querySelector('use').setAttribute('href', '#' + name);
      for (const shade of ['green', 'yellow', 'blue', 'muted']) element.classList.toggle(shade, shade === (active ? color : 'muted'));
    }
    function showState(state) {
      const missing = state === 'unavailable';
      const charging = state === 'charging';
      const snowy = state === 'snow';
      document.querySelectorAll('[data-state]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.state === state)));
      for (const id of ['battery-bar', 'battery-status']) setIcon(id, missing ? 'battery-vertical-exclamation' : charging ? 'battery-vertical-charging' : 'battery-vertical-4', !missing);
      setText('battery-percent', missing ? '—' : '82%');
      setText('battery-time', missing ? '—' : charging ? '45m' : '3h 20m');
      $('battery-time-row').setAttribute('aria-label', charging ? '충전 완료까지 예상 시간' : '예상 사용 가능 시간');
      for (const id of ['weather-bar', 'weather-status']) setIcon(id, snowy ? 'cloud-snow' : 'cloud', !missing, snowy ? 'blue' : 'yellow');
      setIcon('weather-precip-icon', missing ? 'cloud' : snowy ? 'cloud-snow' : 'cloud-rain', !missing, 'blue');
      setText('weather-temp', missing ? '—°' : snowy ? '-2°' : '18°');
      setText('weather-feels', missing ? '(—°)' : snowy ? '(-6°)' : '(17°)');
      setText('weather-high', missing ? '—°' : snowy ? '1°' : '21°');
      setText('weather-low', missing ? '—°' : snowy ? '-5°' : '12°');
      setText('weather-probability', missing ? '—%' : snowy ? '80%' : '30%');
      setText('weather-wind', missing ? '—m/s' : snowy ? '5.1m/s' : '3.2m/s');
      for (const id of ['wifi-bar', 'wifi-status']) setIcon(id, missing ? 'wifi-off' : 'wifi', !missing);
      setText('wifi-state', missing ? '연결 끊김' : 'Home Wi-Fi');
      $('wifi-state').setAttribute('title', missing ? '연결 끊김' : 'Home Wi-Fi');
      setText('wifi-ip', missing ? '—' : '192.168.0.24');
    }
    document.querySelectorAll('[data-state]').forEach(button => button.addEventListener('click', () => showState(button.dataset.state)));
    $('enlarge').addEventListener('change', event => $('cards').classList.toggle('large', event.target.checked));
    showState('normal');
  </script>
</body>
